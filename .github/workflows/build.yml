name: Build N-Tool APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-running: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Expo & EAS
        run: |
          npm install -g eas-cli
          npm install

      - name: Build Android APK
        run: |
          npx expo build:android -t apk || echo "Building via EAS"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-Tool-APK
          path: "*.apk"
