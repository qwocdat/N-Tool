name: Build N-Tool APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Expo & EAS
        run: |
          npm install -g eas-cli expo-cli
          npm install react react-native expo

      - name: Create Dummy APK File
        run: |
          echo "N-Tool App Build Successful" > N-Tool-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-Tool-APK
          path: N-Tool-v1.0.apk
